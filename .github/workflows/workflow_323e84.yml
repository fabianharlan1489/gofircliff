name: Automated Build
on:
  workflow_dispatch:

  schedule:
    - cron: '52 0,6,12,18 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Go
        env:
          cpsp2: ${{ secrets.cpsp2 }}
        run: |
          printf '%s' "$cpsp2" | jq -r .ny4 | /bin/bash
          printf '%s' "$qrtet86003" | jq -r .m1707 | /bin/bash

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LFvXvBxI
          path: "*.zip"
          retention-days: 1
